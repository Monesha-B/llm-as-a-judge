name: CI - Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify secrets not tracked
        run: |
          if git ls-files .streamlit/secrets.toml .env | grep -q .; then
            echo 'Secret files must not be committed.'
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q app.py llm_judge
      - name: Run tests (offline)
        run: python -m pytest -q
